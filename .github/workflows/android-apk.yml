name: Android APK

on:
  push:
    branches:
      - phase-mobile-1
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name APK
        run: |
          BUILD_NAME="MoneyMaintainer_$(TZ=Asia/Kolkata date +'%d-%m-%Y_%H-%M').apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/$BUILD_NAME"
          echo "APK_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile/build/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14
